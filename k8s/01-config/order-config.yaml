apiVersion: v1
kind: ConfigMap
metadata:
  name: order-config
  namespace: microservices
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: configuration
data:
  application.yml: |
    eureka:
      client:
        enabled: false
    spring:
      cloud:
        config:
          enabled: false
        openfeign:
          client:
            config:
              inventory-service:
                url: http://inventory-service:8000
      mongodb:
        uri: mongodb://mongo:27017/order_db
      kafka:
        bootstrap-servers: kafka:29092
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
          properties:
            schema.registry.url: http://schema-registry:8081
        template:
          observation-enabled: true
    order-service:
      max-items-per-order: 20
      environment: kubernetes
    app:
      kafka:
        enabled: true
        topics:
          order-events: order-events
    management:
      endpoints:
        web:
          exposure:
            include: "*"
      endpoint:
        health:
          show-details: always
          probes:
            enabled: true
      tracing:
        sampling:
          probability: 1.0

