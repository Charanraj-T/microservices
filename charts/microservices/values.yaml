# Default values for microservices Helm chart.
# This is a YAML-formatted file.

global:
  environment: local

# -----------------------------------------------------------------------------
# Infrastructure Layer (Stateful)
# Toggle 'enabled: false' when connecting to managed cloud services (e.g. Atlas, MSK, Event Hubs)
# -----------------------------------------------------------------------------
infrastructure:
  mongodb:
    enabled: true
    image: mongo:7.0
    port: 27017
    uri: "mongodb://mongo:27017"
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"

  kafka:
    enabled: true
    image: confluentinc/cp-kafka:7.7.1
    port: 29092
    bootstrapServers: "kafka:29092"
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "1024Mi"
        cpu: "1000m"

  schemaRegistry:
    enabled: true
    image: confluentinc/cp-schema-registry:7.7.1
    port: 8081
    url: "http://schema-registry:8081"
    resources:
      requests:
        memory: "384Mi"
        cpu: "150m"
      limits:
        memory: "768Mi"
        cpu: "500m"

# -----------------------------------------------------------------------------
# Application Layer (Stateless Microservices)
# -----------------------------------------------------------------------------
inventory:
  replicaCount: 2
  image:
    repository: charanraj165/inventory-service
    tag: latest
    pullPolicy: Always
  service:
    port: 8000
  resources:
    requests:
      memory: "384Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  probes:
    liveness:
      initialDelaySeconds: 60
      periodSeconds: 10
    readiness:
      initialDelaySeconds: 30
      periodSeconds: 5
  config:
    minStockThreshold: 5

order:
  replicaCount: 2
  image:
    repository: charanraj165/order-service
    tag: latest
    pullPolicy: Always
  service:
    port: 8100
  resources:
    requests:
      memory: "384Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  probes:
    liveness:
      initialDelaySeconds: 60
      periodSeconds: 10
    readiness:
      initialDelaySeconds: 30
      periodSeconds: 5
  config:
    maxItemsPerOrder: 20
    kafkaEnabled: true
    orderEventsTopic: "order-events"

notification:
  replicaCount: 2
  image:
    repository: charanraj165/notification-service
    tag: latest
    pullPolicy: Always
  service:
    port: 8200
  resources:
    requests:
      memory: "384Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  probes:
    liveness:
      initialDelaySeconds: 60
      periodSeconds: 10
    readiness:
      initialDelaySeconds: 30
      periodSeconds: 5
  config:
    orderEventsTopic: "order-events"
    dlqTopic: "order-events.dlq"

# -----------------------------------------------------------------------------
# Gateway API & Envoy Gateway Configuration
# -----------------------------------------------------------------------------
gateway:
  gatewayClassName: eg
  name: eg-gateway
  httpPort: 80
  https:
    enabled: true
    port: 443
    tlsSecretName: microservices-tls
  circuitBreaker:
    maxConnections: 1024
    maxPendingRequests: 100
    maxParallelRequests: 1024
  outlierDetection:
    consecutive5XxErrors: 3
    interval: "10s"
    baseEjectionTime: "30s"
    maxEjectionPercent: 100

# -----------------------------------------------------------------------------
# Horizontal Pod Autoscaling (HPA v2)
# -----------------------------------------------------------------------------
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# -----------------------------------------------------------------------------
# High Availability Pod Disruption Budgets (PDB)
# -----------------------------------------------------------------------------
podDisruptionBudget:
  enabled: false
  minAvailable: 1
