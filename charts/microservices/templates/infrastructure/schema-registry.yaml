{{- if .Values.infrastructure.schemaRegistry.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: schema-registry
    app.kubernetes.io/component: messaging
    {{- include "microservices.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schema-registry
  template:
    metadata:
      labels:
        app: schema-registry
    spec:
      enableServiceLinks: false
      containers:
        - name: schema-registry
          image: {{ .Values.infrastructure.schemaRegistry.image }}
          ports:
            - containerPort: {{ .Values.infrastructure.schemaRegistry.port }}
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              value: "schema-registry"
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: {{ .Values.infrastructure.kafka.bootstrapServers | quote }}
            - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: SCHEMA_REGISTRY_LISTENERS
              value: "http://0.0.0.0:{{ .Values.infrastructure.schemaRegistry.port }}"
          resources:
            {{- toYaml .Values.infrastructure.schemaRegistry.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: schema-registry
    app.kubernetes.io/component: messaging
    {{- include "microservices.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: schema-registry
  ports:
    - port: {{ .Values.infrastructure.schemaRegistry.port }}
      targetPort: {{ .Values.infrastructure.schemaRegistry.port }}
{{- end }}

