{{- if .Values.infrastructure.mongodb.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/component: database
    {{- include "microservices.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: {{ .Values.infrastructure.mongodb.image }}
          ports:
            - containerPort: {{ .Values.infrastructure.mongodb.port }}
          resources:
            {{- toYaml .Values.infrastructure.mongodb.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/component: database
    {{- include "microservices.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: mongo
  ports:
    - port: {{ .Values.infrastructure.mongodb.port }}
      targetPort: {{ .Values.infrastructure.mongodb.port }}
{{- end }}

