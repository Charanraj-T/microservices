apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: configuration
    {{- include "microservices.labels" . | nindent 4 }}
data:
  application.yml: |
    server:
      shutdown: graceful
    eureka:
      client:
        enabled: false
    spring:
      cloud:
        config:
          enabled: false
      lifecycle:
        timeout-per-shutdown-phase: 25s
      kafka:
        bootstrap-servers: {{ .Values.infrastructure.kafka.bootstrapServers }}
        consumer:
          group-id: notification-service-group
          auto-offset-reset: earliest
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
          properties:
            spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
            schema.registry.url: {{ .Values.infrastructure.schemaRegistry.url }}
            specific.avro.reader: true
        listener:
          observation-enabled: true
    notification-service:
      environment: {{ .Values.global.environment }}
    app:
      kafka:
        topics:
          order-events: {{ .Values.notification.config.orderEventsTopic }}
          dlq: {{ .Values.notification.config.dlqTopic }}
    management:
      endpoints:
        web:
          exposure:
            include: "*"
      endpoint:
        health:
          show-details: always
          probes:
            enabled: true
      tracing:
        sampling:
          probability: 1.0

