apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: inventory-service
    app.kubernetes.io/component: configuration
    {{- include "microservices.labels" . | nindent 4 }}
data:
  application.yml: |
    server:
      shutdown: graceful
    eureka:
      client:
        enabled: false
    spring:
      cloud:
        config:
          enabled: false
      lifecycle:
        timeout-per-shutdown-phase: 25s
      mongodb:
        uri: {{ .Values.infrastructure.mongodb.uri }}/inventory_db
    inventory-service:
      min-stock-threshold: {{ .Values.inventory.config.minStockThreshold }}
      environment: {{ .Values.global.environment }}
    management:
      endpoints:
        web:
          exposure:
            include: "*"
      endpoint:
        health:
          show-details: always
          probes:
            enabled: true
      tracing:
        sampling:
          probability: 1.0
    resilience4j:
      retry:
        instances:
          sample-retry:
            max-attempts: 3
            wait-duration: 1s
            enable-exponential-backoff: true
            exponential-backoff-multiplier: 2
      circuitbreaker:
        instances:
          sample-circuit-breaker:
            failure-rate-threshold: 50
            sliding-window-type: COUNT_BASED
            sliding-window-size: 10
            minimum-number-of-calls: 5
            wait-duration-in-open-state: 10s
            permitted-number-of-calls-in-half-open-state: 3

