apiVersion: v1
kind: ConfigMap
metadata:
  name: order-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: configuration
    {{- include "microservices.labels" . | nindent 4 }}
data:
  application.yml: |
    server:
      shutdown: graceful
    eureka:
      client:
        enabled: false
    spring:
      cloud:
        config:
          enabled: false
        openfeign:
          client:
            config:
              inventory-service:
                url: http://inventory-service:{{ .Values.inventory.service.port }}
      lifecycle:
        timeout-per-shutdown-phase: 25s
      mongodb:
        uri: {{ .Values.infrastructure.mongodb.uri }}/order_db
      kafka:
        bootstrap-servers: {{ .Values.infrastructure.kafka.bootstrapServers }}
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
          properties:
            schema.registry.url: {{ .Values.infrastructure.schemaRegistry.url }}
        template:
          observation-enabled: true
    order-service:
      max-items-per-order: {{ .Values.order.config.maxItemsPerOrder }}
      environment: {{ .Values.global.environment }}
    app:
      kafka:
        enabled: {{ .Values.order.config.kafkaEnabled }}
        topics:
          order-events: {{ .Values.order.config.orderEventsTopic }}
    management:
      endpoints:
        web:
          exposure:
            include: "*"
      endpoint:
        health:
          show-details: always
          probes:
            enabled: true
      tracing:
        sampling:
          probability: 1.0

