apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: microservices-resilience-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "microservices.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: order-service-route
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: inventory-service-route
  circuitBreaker:
    maxConnections: {{ .Values.gateway.circuitBreaker.maxConnections }}
    maxPendingRequests: {{ .Values.gateway.circuitBreaker.maxPendingRequests }}
    maxParallelRequests: {{ .Values.gateway.circuitBreaker.maxParallelRequests }}
  healthCheck:
    passive:
      consecutive5XxErrors: {{ .Values.gateway.outlierDetection.consecutive5XxErrors }}
      interval: {{ .Values.gateway.outlierDetection.interval }}
      baseEjectionTime: {{ .Values.gateway.outlierDetection.baseEjectionTime }}
      maxEjectionPercent: {{ .Values.gateway.outlierDetection.maxEjectionPercent }}

