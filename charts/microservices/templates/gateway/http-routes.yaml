apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inventory-service-route
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: inventory-service
    {{- include "microservices.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /inventory
      backendRefs:
        - name: inventory-service
          port: {{ .Values.inventory.service.port }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: order-service-route
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: order-service
    {{- include "microservices.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /orders
      backendRefs:
        - name: order-service
          port: {{ .Values.order.service.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/orders
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /orders
      backendRefs:
        - name: order-service
          port: {{ .Values.order.service.port }}

