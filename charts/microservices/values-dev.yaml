# Environment Profile: Development
# Optimized for minimal resource footprint on developer laptops or shared test clusters.

global:
  environment: dev

infrastructure:
  mongodb:
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "250m"

  kafka:
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"

  schemaRegistry:
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "250m"

inventory:
  replicaCount: 1
  resources:
    requests:
      memory: "192Mi"
      cpu: "50m"
    limits:
      memory: "384Mi"
      cpu: "300m"

order:
  replicaCount: 1
  resources:
    requests:
      memory: "192Mi"
      cpu: "50m"
    limits:
      memory: "384Mi"
      cpu: "300m"

notification:
  replicaCount: 1
  resources:
    requests:
      memory: "192Mi"
      cpu: "50m"
    limits:
      memory: "384Mi"
      cpu: "300m"

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

