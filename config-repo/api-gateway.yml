spring:
  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 3
                redis-rate-limiter.burstCapacity: 6
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: Retry
              args:
                retries: 3
                statuses:
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                methods:
                  - GET
                  - POST
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: true

          routes:
            - id: httpbin-get-route
              uri: http://httpbin.org:80
              predicates:
                - Path=/get
              filters:
                - AddRequestHeader=X-Gateway-Header, MyCustomHeaderValue
                - AddRequestParameter=gatewayParam, customParamValue

            - id: inventory-service-route
              uri: lb://inventory-service
              predicates:
                - Path=/inventory/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: inventoryCircuitBreaker
                    fallbackUri: forward:/fallback/inventory

            - id: order-service-route
              uri: lb://order-service
              predicates:
                - Path=/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: orderCircuitBreaker
                    fallbackUri: forward:/fallback/orders

            - id: order-service-v1-rewrite
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - RewritePath=/api/v1/orders(?<segment>.*), /orders${segment}
                - name: CircuitBreaker
                  args:
                    name: orderCircuitBreaker
                    fallbackUri: forward:/fallback/orders

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      orderCircuitBreaker:
        base-config: default
      inventoryCircuitBreaker:
        base-config: default

  timelimiter:
    configs:
      default:
        timeout-duration: 3s
    instances:
      orderCircuitBreaker:
        base-config: default
      inventoryCircuitBreaker:
        base-config: default
